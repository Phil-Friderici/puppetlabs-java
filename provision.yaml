---
# Litmus provisioning sets for puppetlabs-java.
#
# Provision a set with:
#   pdk bundle exec rake 'litmus:provision_list[<key>]'
# or provision, install the agent and the module in one go:
#   pdk bundle exec rake 'litmus:provision_install[<key>,puppet8]'
#
# See spec/acceptance/README.md for the full workflow.

# Fast single-container smoke test.
default:
  provisioner: docker
  images:
  - litmusimage/ubuntu:22.04

# All targets that can be run locally with docker (CI matrix, see .github/workflows/litmus.yml).
docker:
  provisioner: docker
  images:
  - litmusimage/ubuntu:20.04
  - litmusimage/ubuntu:22.04
  - litmusimage/debian:11
  - litmusimage/centos:7
  - litmusimage/centos:stream8

docker_debian:
  provisioner: docker
  images:
  - litmusimage/debian:11

docker_ubuntu:
  provisioner: docker
  images:
  - litmusimage/ubuntu:20.04
  - litmusimage/ubuntu:22.04

docker_el7:
  provisioner: docker
  images:
  - litmusimage/centos:7

docker_el8:
  provisioner: docker
  images:
  - litmusimage/centos:stream8

# Additional RedHat derivatives listed in metadata.json.
docker_el_extended:
  provisioner: docker
  images:
  - litmusimage/rockylinux:8
  - litmusimage/almalinux:8

# SLES has no public litmus docker image, it is provisioned as a cloud VM.
# Requires access to the Puppet provision service (GitHub Actions in the puppetlabs org).
sles:
  provisioner: provision_service
  images:
  - sles-15

# Local VMs, for platforms where a container is not representative enough.
vagrant:
  provisioner: vagrant
  images:
  - generic/ubuntu2004
  - generic/ubuntu2204
  - generic/debian11
  - generic/centos7
  - generic/centos8s

# Full release check on cloud VMs (Puppet provision service).
release_checks:
  provisioner: provision_service
  images:
  - centos-7
  - rhel-8
  - rhel-9
  - debian-11
  - debian-12
  - ubuntu-2004-lts
  - ubuntu-2204-lts
  - sles-15
